<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f6eedc"><title>40周小记 · MY PREGNANCY LOG</title><link rel="icon" type="image/png" href="./icon.png"><link rel="stylesheet" href="./styles.css"></head><body><main class="app-shell">
<header class="app-header"><div class="brand-lockup"><img class="brand-leaf" src="./assets/status/title-leaf.png" alt=""><div><p class="eyebrow">MY PREGNANCY LOG</p><h1>40周小记</h1></div></div><p class="header-note">COMMUNITY<br>只保存在此页面</p></header>
<section class="view view-home" data-view="home"><div class="home-hero"><span class="intro-mark">✦</span><h2>今天有什么想留下的吗？</h2><p>世界由时间自动展开，故事由你自己留下。</p></div><div class="entry-list"><button class="entry-card" type="button" data-open="memory"><span class="entry-icon">✎</span><span><b>记录一件事</b><small>身体的一次变化、一次产检、第一次发现、一句话、一个值得记住的瞬间……</small></span><i>→</i></button><button class="entry-card" type="button" data-open="status"><span class="entry-icon">✦</span><span><b>快速记录今天的状态</b><small>用一分钟留下今天的身体和心情。</small></span><i>→</i></button></div><p class="privacy-note">你的记录只在当前设备处理，不会上传。</p></section>
<section class="view form-view" data-view="memory" hidden><button class="back-button" type="button" data-back>← 返回</button><div class="form-heading"><span class="section-code">01</span><div><h2>记录一件事</h2><p>不要求每天记录，值得留下时再写。</p></div></div><form id="memory-form" novalidate><div class="week-date-fields"><label class="field"><span>日期</span><input id="memory-date" type="text" inputmode="numeric" maxlength="10" placeholder="2026.08.31"></label><label class="field"><span>孕周</span><div class="week-inputs"><span>W</span><input id="memory-week-major" type="number" min="1" max="40" inputmode="numeric" value="5" aria-label="孕周周数"><em>+</em><input id="memory-week-minor" type="number" min="0" max="6" inputmode="numeric" value="0" aria-label="孕周天数"></div></label></div><label class="field"><span>发生了什么？</span><textarea id="memory-content" rows="4" maxlength="120" placeholder="例如：今天第一次觉得特别困。"></textarea><small><b id="memory-content-count">0</b> / 120 字</small></label><label class="field memory-field"><span>我想记住</span><textarea id="memory-note" rows="3" maxlength="100" placeholder="可以写下当时的感受，或一句想留住的话。"></textarea><small><b id="memory-note-count">0</b> / 100 字</small></label><p class="form-error" id="memory-error" role="alert"></p><button class="primary-button" type="submit">生成我的记录卡 <span>↓</span></button></form></section>
<section class="view form-view" data-view="status" hidden><button class="back-button" type="button" data-back>← 返回</button><div class="form-heading"><span class="section-code">01</span><div><h2>快速记录今天的状态</h2><p>不用标准答案，按今天的感受填写。</p></div></div><form id="status-form" novalidate><div class="week-date-fields"><label class="field"><span>日期</span><input id="status-date" type="text" inputmode="numeric" maxlength="10" placeholder="2026.08.31"></label><label class="field"><span>孕周</span><div class="week-inputs"><span>W</span><input id="status-week-major" type="number" min="1" max="40" inputmode="numeric" value="5" aria-label="孕周周数"><em>+</em><input id="status-week-minor" type="number" min="0" max="6" inputmode="numeric" value="0" aria-label="孕周天数"></div></label></div><div class="field-grid"><label class="field"><span>精神</span><select id="status-energy"></select></label><label class="field"><span>睡眠</span><select id="status-sleep"></select></label><label class="field field-wide"><span>身体感受</span><input id="status-body" type="text" maxlength="24" placeholder="例如：今天没什么特别感觉"></label><label class="field"><span>食欲</span><select id="status-appetite"></select></label><label class="field"><span>活动</span><select id="status-activity"></select></label><label class="field"><span>心情</span><select id="status-mood"></select></label></div><label class="field memory-field"><span>今天最想记住的一件事</span><textarea id="status-memory" rows="3" maxlength="100" placeholder="比如：今天第一次觉得自己真的在经历一段新旅程。"></textarea><small><b id="status-memory-count">0</b> / 100 字</small></label><p class="form-error" id="status-error" role="alert"></p><button class="primary-button" type="submit">生成我的状态卡 <span>↓</span></button></form></section>
<section class="view result-view" data-view="result" hidden><button class="back-button" type="button" data-back>← 继续记录</button><div class="form-heading"><span class="section-code">02</span><div><h2>你的记录卡</h2><p>保存下来，等以后回头看看。</p></div></div><div class="preview-wrap"><canvas id="status-canvas" width="1024" height="1536" aria-label="孕期记录卡预览"></canvas></div><p class="preview-hint">图片里的文字会由当前页面生成，不会上传任何数据。</p><button id="download-button" class="primary-button" type="button">保存图片 <span>↓</span></button><p id="download-status" class="download-status" role="status"></p><img id="generated-image" class="generated-image" alt="已生成的孕期记录卡，可长按保存" hidden></section><footer>40周孕期实验 · COMMUNITY LOG</footer></main>
<script src="./core/record-model.js"></script><script src="./core/record-validation.js"></script><script src="./core/gestational-week.js"></script><script src="./core/status-options.js"></script><script src="./core/card-content.js"></script><script src="./core/analytics.js"></script><script src="./app.js"></script></body></html>
